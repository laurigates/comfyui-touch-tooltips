[project]
name = "comfyui-touch-tooltips"
description = "Long-press tooltips for ComfyUI widgets and sockets on touch devices."
version = "0.1.9"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lauri Gates" }]
keywords = ["comfyui", "comfyui-nodes", "ui", "mobile", "touch", "tooltips"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
    "Topic :: Multimedia :: Graphics",
]

# Floor tied to the tooltip metadata surfaced by the modern frontend.
dependencies = [
    "comfyui-frontend-package>=1.40.0",
]

[project.urls]
Repository = "https://github.com/laurigates/comfyui-touch-tooltips"
Issues = "https://github.com/laurigates/comfyui-touch-tooltips/issues"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    "pre-commit>=4",
]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.comfy]
PublisherId = "laurigates"
DisplayName = "Touch Tooltips"
Icon = "https://raw.githubusercontent.com/laurigates/comfyui-touch-tooltips/main/icon.png"
Banner = "https://raw.githubusercontent.com/laurigates/comfyui-touch-tooltips/main/banner.png"
# The built frontend (web/dist/) is git-ignored — emitted by `bun run
# build`. publish-node-action honors [tool.comfy] includes to force-add
# otherwise-ignored paths into the published tarball. See ADR-0001.
includes = ["web/dist"]
